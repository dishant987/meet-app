# Local development only: a Postgres database on your machine (port 5433).
# Delete this file once DATABASE_URL points to Neon.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: meet
      POSTGRES_PASSWORD: meet
      POSTGRES_DB: meetapp
    ports: ["5433:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]


volumes:
  dbdata:
